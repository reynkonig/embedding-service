[project]
name = "universal-embedding-server"
version = "0.1.0"
description = "OpenAI-compatible Hugging Face embedding server with multi-GPU replicas"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "accelerate==1.12.0",
    "einops==0.8.2",
    "fastapi==0.140.7",
    "numpy==2.4.6",
    "sentencepiece==0.2.2",
    "torch==2.9.1",
    "transformers==4.57.6",
    "uvicorn[standard]==0.51.0",
]

[project.scripts]
embedding-server = "embedding_service.cli:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["embedding_service"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
